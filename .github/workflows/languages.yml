name: Update Language Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/languages.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate private-aware language card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=DaSe2005&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&theme=github_dark&hide_border=true&custom_title=Languages&card_width=445"
          path: profile/top-langs.svg
          token: ${{ secrets.GRS_TOKEN }}

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/top-langs.svg
          git commit -m "Update language stats" || exit 0
          git push
